name: Maven CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Test, coverage gate & package (NMS, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore Spigot NMS artifacts (remapped-mojang)
        id: nms-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-nms-${{ runner.os }}-mc1.21.1-jdk21-btv5.3.0
          restore-keys: |
            spigot-nms-${{ runner.os }}-mc1.21.1-jdk21-
      - name: Provision remapped-mojang via BuildTools (runs only on cache miss)
        if: ${{ steps.nms-cache.outputs.cache-hit != 'true' }}
        uses: SpraxDev/Action-SpigotMC@6419bc4cdfb60d37bd3f541f6c8d5be60e6e0933  # v5.3.0
        with:
          versions: '1.21.1'
          remapped: true
          generateSrc: false
          generateDoc: false
          disableJavaCheck: false
          forceRun: false
      - name: Verify
        # verify runs test, then jacoco:check, then package -- one command replaces the
        # shared workflow's separate test and package steps, and is the only phase at
        # which the coverage gate runs (D-05). This is the one repository in the phase-9
        # ecosystem that cannot be built without first provisioning the remapped-mojang
        # Spigot artifact above, since ultibot-v1_21_R1 depends on it directly.
        run: mvn -B verify
